name: Semantic Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  TERMIX_RELEASE_PHASE: migration

jobs:
  verify:
    name: Verify successful main CI
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Verify CI provenance and current main
        id: verify
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { action, repository, workflow, workflow_run: run } = context.payload;
            const workflowPath = '.github/workflows/ci.yml';
            const mainWorkflowPaths = [workflowPath, `${workflowPath}@main`, `${workflowPath}@refs/heads/main`];
            if (action !== 'completed' || !repository?.id || !run ||
                run.repository?.id !== repository.id || run.head_repository?.id !== repository.id ||
                workflow?.path !== workflowPath || workflow.id !== run.workflow_id ||
                !mainWorkflowPaths.includes(run.path) || run.event !== 'push' ||
                run.head_branch !== 'main' || run.status !== 'completed' ||
                run.conclusion !== 'success' || !/^[a-f0-9]{40}$/.test(run.head_sha)) {
              core.info('Skipping release because the event is not a successful main push CI run in this repository.');
              return;
            }

            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            let eligible = main.object.sha === run.head_sha;
            if (!eligible && process.env.TERMIX_RELEASE_PHASE === 'migration') {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${run.head_sha}...${main.object.sha}`, per_page: 1,
              });
              eligible = comparison.status === 'ahead';
            }
            if (!eligible) {
              core.info('Skipping release because this CI commit is no longer eligible on main.');
              return;
            }

            core.setOutput('sha', run.head_sha);

  semantic-release:
    name: Semantic Release
    needs: verify
    if: needs.verify.outputs.sha != ''
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-main
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check main after entering the release queue
        id: queued-main
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            let eligible = main.object.sha === sha;
            if (!eligible && process.env.TERMIX_RELEASE_PHASE === 'migration') {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${sha}...${main.object.sha}`, per_page: 1,
              });
              eligible = comparison.status === 'ahead';
            }
            if (eligible) {
              core.setOutput('matches', 'true');
            } else {
              core.info('Skipping release because this CI commit is no longer eligible on main.');
            }

      - name: Checkout verified release commit
        if: steps.queued-main.outputs.matches == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit and establish main branch
        if: steps.queued-main.outputs.matches == 'true'
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          case "$TERMIX_RELEASE_PHASE" in
            migration|stable) ;;
            *) echo '::error::Invalid Termix release phase.'; exit 1 ;;
          esac
          git switch --create main "$RELEASE_SHA"

      - name: Check for a published migration release
        if: steps.queued-main.outputs.matches == 'true' && env.TERMIX_RELEASE_PHASE == 'migration'
        id: migration-existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: bash scripts/publish-migration-release.sh --check-published

      - name: Find verified migration APK from this workflow run
        if: steps.queued-main.outputs.matches == 'true' && env.TERMIX_RELEASE_PHASE == 'migration' && steps.migration-existing.outputs.published != 'true'
        id: migration-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=migration-$RELEASE_SHA" \
            | jq -r '[.artifacts[] | select(.expired == false)] | if length == 0 then "" elif length == 1 then .[0].id else error("Multiple migration artifacts") end')
          printf 'id=%s\n' "$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Restore verified migration APK on retry
        if: steps.migration-artifact.outputs.id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: migration-${{ needs.verify.outputs.sha }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/termix-migration-apk

      - name: Set up JDK 17
        if: steps.queued-main.outputs.matches == 'true' && steps.migration-existing.outputs.published != 'true' && steps.migration-artifact.outputs.id == ''
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Node.js
        if: steps.queued-main.outputs.matches == 'true' && env.TERMIX_RELEASE_PHASE == 'stable'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Grant execute permission for gradlew
        if: steps.queued-main.outputs.matches == 'true' && steps.migration-existing.outputs.published != 'true' && steps.migration-artifact.outputs.id == ''
        run: chmod +x gradlew

      - name: Install release tooling
        if: steps.queued-main.outputs.matches == 'true' && env.TERMIX_RELEASE_PHASE == 'stable'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts \
            semantic-release@25.0.9 @semantic-release/changelog@7.0.0 \
            @semantic-release/exec@7.1.0 @semantic-release/git@11.0.1

      - name: Prepare required Android signing files
        if: steps.queued-main.outputs.matches == 'true' && steps.migration-existing.outputs.published != 'true' && steps.migration-artifact.outputs.id == ''
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          PROP: ${{ secrets.PROP }}
          TERMIX_RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE" || -z "$PROP" ]]; then
            echo "::error::Set both KEYSTORE and PROP for release signing."
            exit 1
          fi
          source scripts/release-signing.sh
          load_release_signing

          umask 077
          signing_dir="$RUNNER_TEMP/termix-signing"
          mkdir -- "$signing_dir"
          trap 'rm -rf -- "$signing_dir"' ERR
          printf '%s' "$KEYSTORE" | base64 --decode > "$signing_dir/termix-keystore"
          printf '%s' "$PROP" | base64 --decode > "$signing_dir/termix-signing.properties"
          test -s "$signing_dir/termix-keystore"
          test -s "$signing_dir/termix-signing.properties"

      - name: Build and verify Android migration APK
        if: steps.queued-main.outputs.matches == 'true' && env.TERMIX_RELEASE_PHASE == 'migration' && steps.migration-existing.outputs.published != 'true' && steps.migration-artifact.outputs.id == ''
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/termix-signing/termix-keystore
          SIGNING_PROPERTIES_FILE: ${{ runner.temp }}/termix-signing/termix-signing.properties
          TERMIX_RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          mkdir -p -- "$RUNNER_TEMP/termix-migration-apk"
          bash scripts/build-migration-release.sh "$RUNNER_TEMP/termix-migration-apk/termix-v1.4.1.apk"

      - name: Preserve verified migration APK for release retries
        if: steps.queued-main.outputs.matches == 'true' && env.TERMIX_RELEASE_PHASE == 'migration' && steps.migration-existing.outputs.published != 'true' && steps.migration-artifact.outputs.id == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-${{ needs.verify.outputs.sha }}
          path: ${{ runner.temp }}/termix-migration-apk/termix-v1.4.1.apk
          if-no-files-found: error

      - name: Create release App token
        if: steps.queued-main.outputs.matches == 'true' && steps.migration-existing.outputs.published != 'true'
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: ${{ env.TERMIX_RELEASE_PHASE == 'stable' && 'write' || '' }}
          permission-pull-requests: ${{ env.TERMIX_RELEASE_PHASE == 'stable' && 'write' || '' }}

      - name: Verify release App token repository scope
        if: steps.queued-main.outputs.matches == 'true' && steps.migration-existing.outputs.published != 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ steps.release-app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const { data: installation } = await github.request('GET /installation/repositories');
            if (installation.total_count !== 1 || installation.repositories?.length !== 1 ||
                installation.repositories[0].full_name !== `${owner}/${repo}`) {
              throw new Error('Release App token must be scoped to this repository only.');
            }

      - name: Confirm release commit is still eligible on main
        if: steps.queued-main.outputs.matches == 'true' && steps.migration-existing.outputs.published != 'true'
        id: current-main
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            let eligible = main.object.sha === sha;
            if (!eligible && process.env.TERMIX_RELEASE_PHASE === 'migration') {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${sha}...${main.object.sha}`, per_page: 1,
              });
              eligible = comparison.status === 'ahead';
            }
            if (eligible) {
              core.setOutput('matches', 'true');
            } else {
              core.info('Skipping release because this CI commit is no longer eligible on main.');
            }

      - name: Semantic Release
        id: publish
        if: steps.current-main.outputs.matches == 'true' && env.TERMIX_RELEASE_PHASE == 'stable'
        continue-on-error: true
        run: ./node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          KEYSTORE_FILE: ${{ runner.temp }}/termix-signing/termix-keystore
          SIGNING_PROPERTIES_FILE: ${{ runner.temp }}/termix-signing/termix-signing.properties
          TERMIX_RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}

      - name: Recover incomplete GitHub Release
        if: steps.publish.outcome == 'failure' && env.TERMIX_RELEASE_PHASE == 'stable'
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: bash scripts/recover-release.sh "$RELEASE_SHA"

      - name: Publish Android migration release
        if: steps.current-main.outputs.matches == 'true' && env.TERMIX_RELEASE_PHASE == 'migration'
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: bash scripts/publish-migration-release.sh "$RUNNER_TEMP/termix-migration-apk/termix-v1.4.1.apk"

      - name: Clean up signing files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/termix-signing"
